# === Campos opcionais contextuais ===
observacoes: >
  Primeiro piloto B-pendente do KB-PD (ver watchlist/README.md). Tema de
  Repercussão Geral 1148 — "Limites para decretação judicial da quebra de
  sigilo de dados telemáticos, no âmbito de procedimentos penais, em
  relação a pessoas indeterminadas." Assuntos: DIREITO PROCESSUAL PENAL |
  Ação Penal | Nulidade | Ausência de Fundamentação; DIREITO PROCESSUAL
  PENAL | Investigação Penal. Leading case de elevada relevância para o
  KB-PD por tratar da constitucionalidade de busca reversa por
  palavra-chave em provedores de aplicação (art. 22 Lei 12.965/2014 —
  Marco Civil da Internet), com interveniência de Monica Tereza Azeredo
  Benicio, viúva de Marielle Franco (INTDO). Recorrentes: Google Brasil
  Internet Ltda. e Google Inc.; recorridos: Estado do RJ, MPRJ e MPF.
  Amici curiae: Educafro, IBCCrim, ITS Rio, Facebook e MP-MG (INTDO).
  Origem: RMS 60698/STJ e Mandado de Segurança 0072968-96.2018.8.19.0000
  (TJRJ). Coleta byte-a-byte de 7 abas AJAX do portal realizada em
  2026-04-23T18:23:06Z via Invoke-WebRequest (PS 5.1 em Win10) com warm-up
  de sessão (cookies AWSALB + ASPSESSIONIDCWRRDDCS). Manifest completo com
  sha256 + http_status + Content-Type das 7 respostas preservado em
  outputs/_scratch/manifest-RE1301250-2026-04-23T18-23-06Z.json durante a
  bootstrap da Etapa 0.5; auditoria cruzada possível comparando hash
  registrado aqui (01-detalhe.html) com manifest. Nenhum L0 será gerado
  enquanto não houver acórdão publicado e trânsito em julgado — a entry
  correspondente em watchlist/index.yaml governa a recoleta e o eventual
  gate de promoção para corpus/ canônico (schema §4.4).
