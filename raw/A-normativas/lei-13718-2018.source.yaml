observacoes: >
  Lei 13.718/2018 (sanção 24/09/2018, publicação DOU 25/09/2018).
  Tipifica importunação sexual (art. 215-A CP) e divulgação de cena de
  estupro/nudez/ato sexual sem consentimento (art. 218-C CP); altera
  regime de ação penal nos crimes contra dignidade sexual (art. 225 CP:
  passa a ser pública incondicionada).
  Particularidade de encoding: 147 bytes high-bit (0.70%) mas ZERO na
  faixa 0x80-0x9F exclusiva de CP1252. iconv Latin-1 funcionaria sem
  corromper NESTE arquivo específico, mas a política v1.2 do projeto
  é SEMPRE usar WINDOWS-1252 para qualquer ato do Planalto,
  independentemente da ausência/presença de bytes distintivos.
  Vetor forense central para KB-PD: art. 218-C é o tipo penal de
  referência para revenge porn, deepnudes e divulgação em chats/grupos.
  Conectar no L2 com art. 154-A CP (invasão de dispositivo) como pré-
  requisito comum do iter criminis e com LGPD arts. 5º II e 14 §1º.
