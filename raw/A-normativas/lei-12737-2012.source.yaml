observacoes: >
  Lei 12.737/2012 — Lei "Carolina Dieckmann" (sanção Dilma Rousseff
  30/11/2012, publicação DOU 03/12/2012, vigência 03/04/2013 após
  vacatio de 120 dias). Introduz art. 154-A CP (invasão de dispositivo
  informático) e altera art. 266 CP (interrupção de serviço de
  informação de utilidade pública). Tamanho 11.916 B.

  ENCODING: 162 bytes high-bit (1.36%); 8 bytes na faixa 0x80-0x9F
  EXCLUSIVA de CP1252 (0x93×4 aspas-abre + 0x94×4 aspas-fecha). iconv
  Latin-1 corromperia silenciosamente esses 8 bytes — uso obrigatório
  de WINDOWS-1252 confirmado byte a byte.

  FIDELIDADE PLANALTO — bug ordinal `<u><sup>o</sup></u>` no fecho:
  AUSENTE. Gestão Dilma (2012). Zero ocorrências do padrão; ordinais
  aparecem como 'º' UTF-8 real (amostra: 1º, 2º, 3º, 4º...). Data
  point empírico novo para §Fidelidade do AGENTS.md.

