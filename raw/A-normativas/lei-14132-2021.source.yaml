observacoes: >
  Lei 14.132/2021 (sanção 31/03/2021, publicação DOU 01/04/2021 edição extra).
  Cria art. 147-A CP (crime de perseguição/stalking) e revoga art. 65 LCP.
  Conteúdo: 4 artigos, texto curto (14.333 B).
  Presença confirmada de 6 bytes na faixa 0x80-0x9F exclusiva de CP1252
  (aspas tipográficas em "§", "§§" e similar); iconv Latin-1 corromperia
  silenciosamente. Preservar bugs do Planalto "200o" (200º) e "133o" (133º)
  no fecho, como nas demais leis já ingeridas.
  Ligação direta com projeto KB-PD: modalidade online do stalking é vetor
  principal de uso forense do 147-A; par com Lei 11.340/2006 (MPU) e com
  Convenção de Budapeste.
