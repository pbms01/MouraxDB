observacoes: >
  Lei 14.188/2021 (sanção 28/07/2021, publicação DOU 29/07/2021).
  Define violência psicológica contra a mulher (cria art. 147-B CP) e altera
  art. 129 § 9º CP para incluir violência psicológica como forma de violência
  doméstica. Também altera a Lei Maria da Penha (Lei 11.340/2006) para
  incluir o programa de cooperação "Sinal Vermelho" e ampliar o rol de
  condutas configuradoras de violência doméstica e familiar.
  Conteúdo: 18.263 B, 8 bytes exclusivos CP1252 (0x80-0x9F), 170 high-bit
  (0.93%) — típico do Planalto. Vetor forense direto: monitoramento de
  mensagens e práticas de controle coercitivo em dispositivos digitais
  frequentemente caracterizam violência psicológica.
