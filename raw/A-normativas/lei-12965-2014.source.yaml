observacoes: >
  Lei 12.965/2014 — Marco Civil da Internet (sanção Dilma Rousseff
  23/04/2014, publicação DOU 24/04/2014, vigência 60 dias após). Lei
  cardinal do direito digital brasileiro: define princípios, direitos
  e garantias no uso da Internet; institui regimes de guarda de
  registros de conexão (art. 13) e de acesso a aplicações (art. 15);
  regime de responsabilidade de provedores (arts. 18-21). Tamanho
  119.976 B — é o documento Tipo A mais longo já depositado em raw/.

  ENCODING: 1.851 bytes high-bit (1.54%); ZERO bytes na faixa 0x80-0x9F
  exclusiva de CP1252 — mesmo perfil da Lei 13.718/2018. Neste arquivo
  específico iconv Latin-1 funcionaria sem corromper, mas a política
  v1.2 do projeto é SEMPRE usar WINDOWS-1252 para qualquer ato do
  Planalto, independentemente da ausência de bytes distintivos. `file`
  classifica como ISO-8859 text (consistente com a ausência de bytes
  0x80-0x9F).

  FIDELIDADE PLANALTO — bug ordinal `<u><sup>o</sup></u>` no fecho:
  AUSENTE. Gestão Dilma (2014). Zero ocorrências do padrão; ordinais
  aparecem como 'º' UTF-8 real. Data point empírico novo para
  §Fidelidade do AGENTS.md.

  PECULIARIDADES JÁ TRATADAS no inbox/lei-12965-2014.md: art. 12 e
  incisos VII/VIII do art. 5º duplicados por MP 1.068/2021 (rejeitada);
  arts. 8º-A/B/C/D e 28-A entraram como status:superado e
  valido_ate:2021-10-27 por efeito da rejeição. Art. 19 com eficácia
  condicionada pelo STF (ADI 6.031 + RE 1.037.396 — par obrigatório
  para ingestão como Tipo B no bootstrap).

