observacoes: |
  Arquivo HTML bruto do Planalto na rota /ccivil_03/decreto-lei/del2848compilado.htm.
  Tamanho 659.965 bytes (~660 KB) — compilação integral do CP atualizada até 2026-04-10.

  COMPORTAMENTO HTTP — DIVERGÊNCIA com a nota da CF/1988:
  No download da CF (sidecar cf-1988-compilada.source.yaml, 2026-04-22 17:32 BRT)
  foi documentado que o Planalto rejeitou User-Agent não-browser. Neste download
  (mesmo dia, 19:49 UTC = 16:49 BRT, ~30 min depois da CF) o User-Agent
  "Mozilla/5.0 (KBPD-pipeline-v1.2)" foi aceito sem timeout. Possíveis explicações:
  (a) inconsistência transiente do filtro do Planalto, (b) o filtro só requer
  o prefixo "Mozilla/5.0" e não o full UA de browser real, (c) política mudou.
  Registrar como data point para o cookbook de download.

  ENCODING confirmado WINDOWS-1252 por presença de bytes 0x96 (en-dash) e 0x94
  (aspa tipográfica direita) — bytes incompatíveis com Latin-1 estrito. Aplicar
  regra permanente AGENTS.md §96: iconv -f WINDOWS-1252 -t UTF-8.

  HIPÓTESE BUG ORDINAL — ACHADO DECISIVO PARA REFINAMENTO:
  Este arquivo apresenta COEXISTÊNCIA — 1.500 ocorrências de º correto +
  ~105 instâncias bugadas distribuídas entre DOIS padrões (<u><sup>o</sup></u>
  e <sup><u>o</u></sup>). Isso refuta a v2 como predição binária ("compilação
  AJ = template limpo"). Hipótese v3 (rascunho): o bug é injetado em blocos
  editoriais NOVOS quando incorporados a códigos antigos — cada lei alteradora
  carrega seu próprio template, e a compilação acumula. Falsável: códigos
  novos com pouca alteração devem ter ratio bug/correto baixo; códigos antigos
  muito alterados devem ter ratio mais alto. Este achado conversa com o do
  CPP (sidecar irmão) que amplifica o sinal (~30% bugado vs. ~7% aqui).

  POLÍTICA DE FIDELIDADE INALTERADA (AGENTS.md §170): preservar byte-a-byte
  os dois padrões bugados E o U+00BA. Não normalizar.

  INTEGRIDADE BYTE-A-BYTE vs GIT autocrlf: o sha256 acima foi calculado sobre
  o binário CRLF original (como baixado do Planalto). O .gitattributes do
  projeto força eol=lf em raw/**/*.html — após commit + reclone, o checkout
  produzirá LF, e o sha256 do arquivo em disco DIVERGIRÁ deste. Estado já
  conhecido para os sidecars das outras leis ordinárias do Planalto.
  Possível mitigação: adicionar `raw/**/*.html -text` no .gitattributes
  para tratar como binário (decisão fora do escopo desta coleta).


