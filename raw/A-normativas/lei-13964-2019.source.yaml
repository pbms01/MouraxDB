# Observações operacionais
observacoes: |
  Arquivo HTML bruto do Planalto. 219.503 bytes. Produzido em Microsoft FrontPage 6.0
  (meta generator), padrão típico de consolidações pós-2010 do Planalto.

  Comportamento HTTP: idêntico ao da CF/1988 — requer User-Agent browser real.

  Descoberta crítica para a linha de pesquisa AJ-2021:
  a presença simultânea do bug <u><sup>o</sup></u> (3x) + smart quotes de Word
  (213 bytes 0x80-0x9F, distribuídos exclusivamente em 0x91/0x92/0x93/0x94)
  + Last-Modified em 06/08/2021 sugere que a compilação foi feita por cópia de
  documento Word durante a gestão AJ-Bolsonaro.

  O arquivo contém a LEI INTEGRAL, com:
  - corpo promulgado em 24/12/2019;
  - redações restauradas após derrubada de vetos pelo Congresso (abril/2021);
  - notas de acórdãos suspendendo dispositivos (ADI 6298 juiz das garantias).

  Esta é uma lei de ALTERAÇÃO MÚLTIPLA: distinguir no chunking entre (a) dispositivos
  PRÓPRIOS da Lei 13.964 (regras de vigência, conflito, etc.) e (b) blocos de ALTERAÇÃO
  que reescrevem dispositivos de outros códigos (CP, CPP, LEP, etc.). Os blocos de
  alteração devem ser chunked com identificador duplo: "lei 13.964 art. X altera CPP art. Y".

  Este arquivo é o PRIMEIRO teste de falseamento forte da hipótese AJ-2021: lei
  promulgada em 2019 (pré-janela) com evidência de compilação em 2021 (dentro da janela)
  — bug presente como predito sob a hipótese refinada.

