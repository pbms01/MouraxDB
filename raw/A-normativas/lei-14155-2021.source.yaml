observacoes: >
  Lei 14.155/2021 (sanção Jair Bolsonaro 27/05/2021, publicação DOU
  28/05/2021). Altera: (i) art. 155 §4º-B CP — furto qualificado por
  fraude mediante dispositivo eletrônico ou informático; (ii) art. 171
  §2º-A CP — estelionato por meio eletrônico; (iii) art. 70 CPP — foro
  do domicílio da vítima no estelionato. Tamanho 20.916 B.

  ENCODING: 152 bytes high-bit (0.73%); 12 bytes na faixa 0x80-0x9F
  EXCLUSIVA de CP1252 (0x93×4 aspas-abre + 0x94×4 aspas-fecha + 0x96×4
  en-dash). iconv Latin-1 corromperia silenciosamente — uso obrigatório
  de WINDOWS-1252 confirmado byte a byte.

  FIDELIDADE PLANALTO — bug ordinal `<u><sup>o</sup></u>` no fecho:
  PRESENTE, 2 ocorrências. Literal do fecho: "Brasília,  27  de maio
  de 2021; 200<u><sup>o</sup></u> da Independência e
  133<u><sup>o</sup></u> da República." Gestão Bolsonaro/AJ 2021.
  Primeira verificação byte-a-byte do bug nesta lei pelo pipeline v1.2
  — confirma o que o inbox/ legado já indicava.

