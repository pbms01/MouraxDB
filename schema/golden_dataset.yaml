---
# golden_dataset.yaml
# Dataset de avaliação contínua do pipeline KB-PD — v0.0
# Fonte: KB-PD-plano-v3.md, Seção 16.1
#
# Estrutura de cada entrada:
#   id:                  string — identificador único (ex: gd-001)
#   query:               string — pergunta em linguagem natural
#   tipo:                enum — ver categorias abaixo
#   ancora:              "YYYY-MM-DD" | null — âncora temporal (só tipo: temporal)
#   indice_esperado:     normativo_doutrinario | padroes | ambos | null
#   l0s_esperados:       lista de IDs de L0s que a busca deve recuperar
#   resposta_esperada:   string | null — resposta correta (null se verificação só por L0s)
#   filtros_esperados:   map — metadados que o query router deve detectar
#   notas:               string — o que este par testa especificamente
#
# Categorias de tipo (distribuição-alvo: ~65 pares):
#   normativa_simples     15 pares — lookup direto Tipo A/D, BM25 em identificadores
#   multi_hop_juridico    10 pares — raciocínio cruzado A+B, context recall
#   temporal              10 pares — point-in-time retrieval, valido_desde/valido_ate
#   contrastante_autoridade 10 pares — vinculante vs persuasivo, campo tensoes L2
#   padrao_argumentativo  10 pares — índice de padrões, query routing, Tipo H
#   expansao_vocabulario   5 pares — linguagem informal → vocabulário controlado
#   dialetico              5 pares — par_dialetico_id, polo, view dialética
#   sem_resposta           5 pares — lacuna de cobertura, retrieval_confidence baixo
#
# INSTRUÇÃO DE PREENCHIMENTO:
# Pares são adicionados manualmente pelo especialista de domínio após primeira ingestão.
# Não preencher automaticamente — exemplos sintéticos invalidam a avaliação.
# Prioridade de preenchimento: temporal > contrastante_autoridade > dialetico > sem_resposta
# (os quatro tipos que testam diferenciais arquiteturais específicos da v3).
#
# Casos de referência obrigatórios a incluir quando os L0s estiverem disponíveis:
#   - RE 1.055.941/SP (STF) — leading case prova digital, todos os 4 componentes
#   - HC 841.778/RS (STJ)   — cadeia de custódia digital
#   - ADC 51 (STF)          — constitucionalidade de dispositivos de vigilância
#
# Resultados de avaliação salvos em: schema\eval_results\AAAA-MM-DD.json
# Executar via Claude Code após cada mudança significativa no pipeline e mensalmente.
version: "0.0"
last_updated: ""
total_pairs: 0
pairs_by_type:
  normativa_simples: 0
  multi_hop_juridico: 0
  temporal: 0
  contrastante_autoridade: 0
  padrao_argumentativo: 0
  expansao_vocabulario: 0
  dialetico: 0
  sem_resposta: 0
entries: []
